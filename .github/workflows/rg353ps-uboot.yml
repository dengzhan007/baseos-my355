name: RG353PS boot components

on:
  pull_request:
    branches: [main]
    paths:
      - "platforms/rg353ps/**"
      - "tools/common.sh"
      - ".github/workflows/rg353ps-uboot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rg353ps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-rg353ps:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          sh -n tools/common.sh
          sh -n platforms/rg353ps/build-uboot.sh
          sh -n platforms/rg353ps/build-kernel.sh

      - name: Build RG353PS U-Boot region
        run: ./platforms/rg353ps/build-uboot.sh

      - name: Build RG353PS Linux kernel, DTB and modules
        run: ./platforms/rg353ps/build-kernel.sh

      - name: Publish intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rg353ps-boot-components
          if-no-files-found: error
          path: |
            work/rg353ps/rg353ps-uboot.bin
            work/rg353ps/rg353ps-u-boot.itb
            work/rg353ps/rg353ps-idbloader.img
            work/rg353ps/rg353ps-uboot.json
            work/rg353ps/rg353ps-uboot.sha256
            work/rg353ps/kernel/output/**
