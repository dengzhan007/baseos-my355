name: RG353PS U-Boot build

on:
  pull_request:
    branches: [main]
    paths:
      - "platforms/rg353ps/**"
      - "tools/common.sh"
      - ".github/workflows/rg353ps-uboot.yml"
  push:
    branches: [rg353ps-port]
    paths:
      - "platforms/rg353ps/**"
      - "tools/common.sh"
      - ".github/workflows/rg353ps-uboot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rg353ps-uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          sh -n platforms/rg353ps/build-uboot.sh
          sh -n tools/common.sh

      - name: Build RG353PS U-Boot region
        run: ./platforms/rg353ps/build-uboot.sh

      - name: Publish intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rg353ps-uboot-intermediate
          if-no-files-found: error
          path: |
            work/rg353ps/rg353ps-uboot.bin
            work/rg353ps/rg353ps-u-boot.itb
            work/rg353ps/rg353ps-idbloader.img
            work/rg353ps/rg353ps-uboot.json
            work/rg353ps/rg353ps-uboot.sha256
