# BaseOS RG353PS settings. Edit this file on the BASEOS_BOOT FAT partition, then reboot.
#
# frontend: diagnostic (safe default), auto, nextui, slot, or custom
# auto scans frontends_order for adapters on the second card.
# NextUI/Slot need a tested RG353PS runtime adapter; a profile alone does not
# make an H700-only executable compatible with the RK3566.
frontend=diagnostic
frontend_device=/dev/mmcblk2p1
frontend_fstype=vfat
frontends_order=nextui,slot,custom
