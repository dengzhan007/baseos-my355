# BaseOS RG353PS settings. Edit on the BASEOS_BOOT partition, then reboot.
#
# The same-card BASEOS_DATA partition is mounted at /mnt/SDCARD on boot and
# is the intended home for frontends, ROMs and saves. A second TF card is only
# a fallback if no local user-data partition is available.
# frontend: diagnostic (safe default), auto, nextui, slot, or custom
# auto scans frontends_order for adapters on /mnt/SDCARD.
frontend=diagnostic
frontend_device=/dev/mmcblk2p1
frontend_fstype=vfat
frontends_order=nextui,slot,custom
# External adapter scripts run with root privileges; opt in explicitly.
allow_external_frontend_adapters=no
