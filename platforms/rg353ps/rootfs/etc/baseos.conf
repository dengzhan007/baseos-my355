# BaseOS RG353PS settings. Normal use requires no manual edits.
# Frontend discovery is automatic: scan TF2 first, then TF1 user data.
# Install frontend packages on a user-data card root, not BASEOS_BOOT.
# Legacy frontend=... and allow_external_frontend_adapters=... keys are ignored.
# This device node is the first TF2 probe; the selector also discovers alternatives.
frontend_device=/dev/mmcblk2p1
# Preference if multiple supported frontend adapters exist on one card.
frontends_order=nextui,slot,custom
# Troubleshooting only: yes bypasses discovery and shows the diagnostic UI.
force_diagnostic=no
